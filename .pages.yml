media:
  input: src/assets
  output: /assets
  rename: safe
  actions:
    - name: optimize-videos
      label: Optimize portfolio videos
      workflow: pages-cms-optimize-videos.yml
      ref: current

content:
  - name: work
    label: Work
    type: collection
    path: src/work
    exclude: [work.json]
    view:
      fields: [title, endDate, featured]
      primary: title
      sort: [endDate, title]
      default:
        sort: endDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: metaTitle
        label: Meta title
        type: string
      - name: description
        label: Description
        type: text
      - name: services
        label: Services
        type: string
      - name: image
        label: Thumbnail image
        type: image
        options:
          path: src/assets/portfolio
      - name: alt
        label: Alt text
        type: string
      - name: endDate
        label: End date (YYYY-MM)
        type: date
      - name: featured
        label: Featured
        type: boolean
      - name: permalink
        label: Permalink
        type: string
      - name: body
        label: Body
        type: text

  - name: writing
    label: Writing
    type: collection
    path: src/writing
    exclude: [writing.11tydata.js]
    view:
      fields: [title, date, type]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: teaser
        label: Teaser / description
        type: text
      - name: image
        label: Cover image
        type: image
        options:
          path: src/assets/writing
      - name: alt
        label: Alt text
        type: string
      - name: external
        label: External link URL
        type: string
        pattern: ^$|^https?://
      - name: source
        label: Source label (e.g. Substack)
        type: string
      - name: type
        label: Type
        type: select
        options:
          values:
            - { value: guides, label: Guides }
            - { value: essays, label: Essays }
            - { value: notes, label: Notes }
      - name: hidden
        label: Hide from listings and RSS
        type: boolean
      - name: permalink
        label: Permalink
        type: string
      - name: body
        label: Body
        type: text

  - name: artProjects
    label: Art projects
    type: file
    path: src/_data/artProjects.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: year
        label: Year
        type: string
      - name: description
        label: Description
        type: text
      - name: link
        label: Link
        type: string
      - name: linkLabel
        label: Link label
        type: string
      - name: images
        label: Images
        type: object
        list:
          collapsible: true
        fields:
          - name: src
            label: Source
            type: image
            options:
              path: src/assets/art
          - name: alt
            label: Alt text
            type: string

  - name: explorations
    label: Explorations (homepage carousel)
    type: file
    path: src/_data/explorations.json
    format: json
    list: true
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          path: src/assets/explorations
      - name: alt
        label: Alt text
        type: string
        required: true

  - name: faqs
    label: FAQs
    type: file
    path: src/_data/faqs.json
    format: json
    fields:
      - name: about
        label: About
        type: object
        list:
          collapsible: true
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer (Markdown)
            type: text
            required: true
      - name: design
        label: Web design
        type: object
        list:
          collapsible: true
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer (Markdown)
            type: text
            required: true
      - name: consultations
        label: Website consultations
        type: object
        list:
          collapsible: true
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer (Markdown)
            type: text
            required: true

  - name: testimonials
    label: Testimonials
    type: file
    path: src/_data/testimonials.json
    format: json
    fields:
      - name: studio
        label: Work with me
        type: object
        list:
          collapsible: true
        fields:
          - name: quote
            label: Quote
            type: text
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: linkUrl
            label: Link URL (name links to it, or the company label when set)
            type: string
          - name: linkLabel
            label: Company label (after the role)
            type: string
      - name: collaborate
        label: Collaborate
        type: object
        list:
          collapsible: true
        fields:
          - name: quote
            label: Quote
            type: text
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: linkUrl
            label: Link URL (name links to it, or the company label when set)
            type: string
          - name: linkLabel
            label: Company label (after the role)
            type: string

  - name: collaborate
    label: Collaborate page
    type: file
    path: src/_data/collaborate.json
    format: json
    fields:
      - name: services
        label: What I do
        type: object
        list:
          collapsible: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
      - name: featured
        label: Featured work (case study file names without .md, in display order)
        type: string
        list: true

  - name: recognition
    label: Recognition
    type: file
    path: src/_data/recognition.json
    format: json
    list: true
    fields:
      - name: year
        label: Year
        type: string
        required: true
      - name: entries
        label: Awards and features
        type: object
        list:
          collapsible: true
        fields:
          - name: label
            label: Awarding body or publication
            type: string
            required: true
          - name: items
            label: Items
            type: string
            list: true

  - name: siteContact
    label: Contact details and social links
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: email
        label: Email address
        type: string
        required: true
      - name: bookingUrl
        label: Intro call booking link
        type: string
        required: true
      - name: consultationUrl
        label: Consultation booking link
        type: string
        required: true
      - name: social
        label: Social links
        type: object
        list:
          collapsible: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true

  - name: headers
    label: HTTP headers
    type: file
    path: src/_headers
    format: code

  - name: redirects
    label: Redirects
    type: file
    path: src/_redirects
    format: code

  - name: robots
    label: robots.txt
    type: file
    path: src/robots.txt
    format: code

  - name: webmcp
    label: WebMCP tool catalog
    type: file
    path: src/well-known/webmcp.json
    format: code

settings:
  content:
    merge: true